name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-catboost.txt
            requirements-forte.txt
            requirements-forte-service.txt

      - name: Install base dependencies
        run: python -m pip install -r requirements.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install optional CatBoost
        run: python -m pip install -r requirements-catboost.txt

      - name: Install local ForteBank API dependencies
        run: python -m pip install -r requirements-forte-service.txt

      - name: Run tests with synthetic fixtures
        run: python -m pytest -q

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Compile Python modules
        run: python -m compileall -q src tests experiments scripts
